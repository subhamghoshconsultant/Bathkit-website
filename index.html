<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bathkit — Branded Bathroom Fittings, Sanitaryware &amp; Service in Kolkata</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #eef2ff;
      --ink: #111827;
      --muted: #4b5563;
      --accent: #2541b2;
      --accent-dark: #172c7a;
      --accent-light: #3b66f5;
      --accent-lighter: #1d4ed8;
      --accent-soft: #e0e7ff;
      --border: #dbe3f2;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(23, 44, 122, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header / Nav */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 98px;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      background: var(--surface);
      padding: 10px 20px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 6px 18px rgba(37, 65, 178, 0.14);
    }

    .brand-logo-img {
      height: 82px;
      width: auto;
      max-width: 320px;
      object-fit: contain;
      display: block;
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand {
      font-size: 1.38rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 16px;
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 500;
      flex-wrap: wrap;
    }

    nav a:hover {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      border: 1px solid var(--accent);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .btn-sm {
      padding: 7px 13px;
      font-size: 0.84rem;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--accent);
      border: 1.5px solid var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent-soft);
      color: var(--accent-dark);
    }

    .btn-wa {
      background: var(--accent-light);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-wa:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    /* Top Silent Autoplay Video Banner */
    .top-video-banner {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      background: #0f172a;
      border-bottom: 2px solid var(--accent);
    }

    .top-banner-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-banner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      background: linear-gradient(
        90deg,
        rgba(15, 23, 42, 0.82) 0%,
        rgba(15, 23, 42, 0.52) 58%,
        rgba(15, 23, 42, 0.25) 100%
      );
    }

    .top-banner-content {
      width: 100%;
      color: #ffffff;
    }

    .top-banner-content h1 {
      color: #ffffff;
      margin-bottom: 14px;
    }

    .top-banner-content p {
      color: #e2e8f0;
      font-size: 1.05rem;
      max-width: 720px;
      margin-bottom: 22px;
    }

    .top-banner-content .badge {
      background: rgba(224, 231, 255, 0.92);
      color: var(--accent-dark);
      border-color: #ffffff;
    }

    .top-banner-content .btn-outline {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.7);
    }

    .top-banner-content .btn-outline:hover {
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
    }

    /* Hero */
    .hero {
      padding: 54px 0 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .badge-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent-light);
    }

    .rating-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      border: 1px solid var(--accent-dark);
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.9rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
      max-width: 820px;
      color: var(--ink);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 760px;
      margin-bottom: 24px;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Sections */
    section {
      padding: 52px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    section:nth-of-type(even) {
      background: var(--surface);
    }

    section:last-of-type {
      border-bottom: none;
    }

    .section-title {
      font-size: 1.55rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .section-sub {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.98rem;
      max-width: 780px;
    }

    /* Grid Cards */
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 24px;
    }

    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    section:nth-of-type(even) .card {
      background: var(--bg);
    }

    .showcase-img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      background: var(--surface-alt);
    }

    .brand-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 18px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-logo-box {
      width: 100%;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .brand-logo-img-card {
      max-height: 48px;
      max-width: 100%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-svg-logo {
      height: 40px;
      width: auto;
      max-width: 100%;
      display: block;
    }

    .brand-name {
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .brand-tag {
